name: TMAS Scan

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TMAS Scan
        uses: trendmicro/tmas-scan-action@main
        with:
          artifact: "registry:docker.io/library/nginx:latest"
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          vulnerabilitiesScan: true
          malwareScan: true
          additionalArgs: "--region us-east-1"